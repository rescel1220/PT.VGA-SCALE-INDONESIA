



<!DOCTYPE html>
<html>

<body style='font-family:Arial; text-align:left;'>

<head>
    <meta charset="UTF-8">
</head>


<h2>Produk</h2>

<style>

.container {
    display: flex;
    flex-direction: row;
    justify-content: left;
    align-items: flex-start;
    gap: 40px;
}

.form-box {
    text-align: left;
}

#result table {
    width: 140%;
    border-collapse: collapse;
}

.btn {
    width: 150px;
    padding: 10px;
    font-size: 18px;
    border-radius: 8px;
}

#result th {
    background: #4dace4;
    color: white;
}

#result td,
#result th {
    padding: 4px;
    font-size: 14px;
    border: 1px solid #ccc;
}

</style>



<div class="container">
    <!-- KIRI -->
    <div class="form-box">
        <form onsubmit="return send('produk');">
             <button type="button" onclick="tambahvalue('produk')" class="btn">
             add 
            </button>  
    </form>
    <br>
        <!-- VIEW -->
        <button onclick="viewAll('produk')" class="btn">
        View All
        </button>
    </br>
    <br>
        <button onclick="viewAll('import_produk')" class="btn">
        Import
        </button> 

    </br>
        <p id="status"></p>
    </div>


    <!-- KANAN -->
    <div>

        <!-- SEARCH -->
        <div id="search_box" style="display:none; margin-bottom:10px;">
        <input type="text" id="search" placeholder="Cari ID / Nama..." style="padding:8px; font-size:16px;  width:220px; border-radius:6px;">
        <button onclick="searchData('produk')" class="btn" style="width:60px;"> 
        🔍
    </button>

    </div>
        <!-- HASIL TABLE -->
        <div id="result"></div>

    </div>

</div>

</body>
</html>
