<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <link rel="stylesheet" href="./style.css">
    <title>Login - VGA HUB CENTER</title>
    </style>
</head>

<body class="login-page">

    <div class="login-box">
        <h2>VGA HUB CENTER</h2>

        <div class="form-row">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="" autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="" autocomplete="current-password">
            </div>

            <button  type="button" class="login-button" onclick="login()">
                LOGIN
            </button>

            <button  type="button" class="guest-button"  onclick="guestLogin()">
                PENGUNJUNG
            </button>
        </div>
        <div id="message"></div>
    </div>


  <script src="./script/script.js"></script>
</body>
</html>
