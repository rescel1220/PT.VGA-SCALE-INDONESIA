<!-- =====================================================
     ISI MANUAL BOOK
     ===================================================== -->
<main class="galeri-container">
    <h1>
        Manual Book VGA HUB
    </h1>
    <!-- =================================================
         TOMBOL TAMBAH
         ================================================= -->
    <div class="tambah-area">
        <button class="btn-tambah" onclick="tampilkanFormManual()">
            + Tambah Manual Book
        </button>
    </div>

    <!-- =================================================
         FORM UPLOAD
         ================================================= -->
    <div id="manualUploadForm">
        <h2>
            Tambah Manual Book
        </h2>
        <!-- =================================================
             JUDUL
             ================================================= -->
        <label for="manualJudul">
            Judul Manual Book
        </label>
        <inputtype="text" id="manualJudul" placeholder="Masukkan judul manual book">



        <!-- =================================================
             FILE
             ================================================= -->

        <label for="manualFileInput">
            Pilih File
        </label>

        <input type="file" id="manualFileInput" accept=".txt,.pdf,.csv,.docx">

        <!-- =================================================
             INFORMASI FILE
             ================================================= -->
        <p>
            Format yang diperbolehkan:
            <strong>
                .txt, .pdf, .csv, .docx
            </strong>
        </p>

        <!-- =================================================
             PREVIEW / INFORMASI
             ================================================= -->

        <div id="manualPreview"></div>
        <!-- =================================================
             BUTTON UPLOAD
             ================================================= -->
        <button
            onclick="uploadManualBook()">
            Upload
        </button>
        <!-- =================================================
             STATUS
             ================================================= -->

        <div id="manualUploadStatus"></div>


    </div>



    <!-- =====================================================
         DAFTAR MANUAL BOOK
         ===================================================== -->

    <div
        class="galeri"
        id="manualBookList">


        <!-- Data akan dimasukkan oleh JavaScript -->


    </div>
